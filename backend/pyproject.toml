[project]
name = "fashion-search"
version = "0.1.0"
description = "Conversational AI fashion catalog search API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "pgvector>=0.3.6",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
  "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff==0.12.0"]

[project.scripts]
seed-catalog = "fashion_search.catalog.seed:main"
verify-catalog = "fashion_search.catalog.verify:main"
embed-catalog = "fashion_search.embeddings.cli:main"
cleanup-observability = "fashion_search.observability.cleanup:main"
fashion-eval = "fashion_search.evaluation.runner:main"
fashion-eval-compare = "fashion_search.evaluation.compare:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_search"]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"src/fashion_search/prompts/versions" = "fashion_search/prompts/versions"

[tool.hatch.build.targets.sdist]
include = [
  "src/fashion_search/**",
]
