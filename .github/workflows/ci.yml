name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vastraai
          POSTGRES_PASSWORD: vastraai_ci
          POSTGRES_DB: vastraai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vastraai -d vastraai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vastraai:vastraai_ci@localhost:5432/vastraai?sslmode=disable
      APP_ENVIRONMENT: test
      GEMINI_API_KEY: ""
      GENERATION_PROVIDER: gemini
      EMBEDDING_PROVIDER: gemini
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check src tests migrations
      - run: alembic upgrade head
      - run: seed-catalog
      - run: python -m unittest discover -s tests -v
      - run: python -c 'from fashion_search.main import app; assert app.title'
      - run: python -m fashion_search.evaluation.runner --output /tmp/vastraai-ci-evaluation.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vastraai-backend:ci backend
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t vastraai-frontend:ci frontend
